{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="fw-bold text-center mb-1">Create an Account 🎾</h3>
                <p class="text-muted text-center small mb-4">Join single tennis players in your community</p>

                <form action="/register" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold small">Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g. Alex Kim" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small">NTRP Skill Level</label>
                        <select name="ntrp" class="form-select" required>
                            <option value="2.5">2.5 - Beginner</option>
                            <option value="3.0" selected>3.0 - Intermediate</option>
                            <option value="3.5">3.5 - Advanced Intermediate</option>
                            <option value="4.0">4.0 - Advanced Player</option>
                            <option value="4.5+">4.5+ - Tournament / Pro</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mb-3">Sign Up</button>
                </form>

                <div class="text-center small text-muted">
                    Already have an account? <a href="/login" class="text-primary fw-bold text-decoration-none">Log In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
