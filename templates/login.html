{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="fw-bold text-center mb-1">Welcome Back 👋</h3>
                <p class="text-muted text-center small mb-4">Log in to your tennisgirls account</p>

                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold small">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mb-3">Log In</button>
                </form>

                <div class="text-center small text-muted">
                    Don't have an account yet? <a href="/register" class="text-primary fw-bold text-decoration-none">Sign Up</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
