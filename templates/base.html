<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ServeAI - Tennis Hub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-link navbar-brand fw-bold" href="/">🎾 ServeAI</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/string-advisor">String Tension DIY</a>
                <a class="nav-link" href="/marketplace">Racquet Market</a>
                <a class="nav-link" href="/gesture-community">Swing Feedback</a>
                <a class="nav-link text-warning fw-bold" href="/dating">Court Dating ($1)</a>
            </div>
        </div>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-info">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
